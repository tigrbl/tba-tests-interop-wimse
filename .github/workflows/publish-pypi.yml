name: Publish interop to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv build --project pkgs/tba-test-interop-wimse --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: interop-distribution
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: interop-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
