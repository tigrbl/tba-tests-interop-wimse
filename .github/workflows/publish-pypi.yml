name: Publish interop to PyPI

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Also publish a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: interop-pypi
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interop-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: inputs.publish_github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628916c90dbdf5c8093 # v4
        with:
          name: interop-distribution
          path: dist
      - name: Read release metadata
        id: release
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pkgs/tba-tests-interop-wimse/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          name, version = project["name"], project["version"]
          wheel, = Path("dist").glob("*.whl")
          wheel_version = wheel.name.split("-")[1].split("+", 1)[0]
          is_prerelease = bool(re.search(r"(?:a|b|rc|\.dev)\d+", wheel_version))
          print(f"tag={name}=={version}")
          print(f"pypi_url=https://pypi.org/project/{name}/{version}/")
          print(f"prerelease={str(is_prerelease).lower()}")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PYPI_URL: ${{ steps.release.outputs.pypi_url }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          args=(--target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "PyPI distribution: $PYPI_URL")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          tag_refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -n "$tag_refs" ]]; then
            tagged_commit=$(awk 'END { print $1 }' <<< "$tag_refs")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tagged_commit, expected $GITHUB_SHA" >&2
              exit 1
            fi
            args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz "${args[@]}"
