name: Publish interop results to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Full WIMSE matrix run ID with an audited results artifact
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: interop-results-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: read
    env:
      PACKAGE: pkgs/tba-tests-interop-wimse
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Verify the source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Enter a numeric GitHub Actions run ID." >&2
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          if ! jq -e '.path == ".github/workflows/full-matrix.yml" and .head_branch == "master" and .status == "completed"' <<< "$run" > /dev/null; then
            echo "Choose a completed full matrix run from master." >&2
            exit 1
          fi
          jq -r '"url=" + .html_url + "/attempts/" + (.run_attempt | tostring)' <<< "$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: full-wimse-matrix-results
          path: report
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Build summary and execution browser
        env:
          SOURCE_RUN_URL: ${{ steps.source.outputs.url }}
        run: |
          python "$PACKAGE/tests/render_execution_report.py" \
            --manifest "$PACKAGE/matrix/wimse-interop-rich-nine-hop-executions.json.gz" \
            --report report --site-dir site --run-url "$SOURCE_RUN_URL"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy results
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
