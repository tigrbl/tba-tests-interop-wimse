name: Full WIMSE interoperability matrix

on:
  workflow_dispatch:
    inputs:
      baseline_shards:
        description: Number of hosted shards for the baseline matrix
        type: choice
        default: '32'
        options: ['16', '32', '64']
      nine_hop_shards:
        description: Number of hosted shards for the nine-hop matrix
        type: choice
        default: '16'
        options: ['8', '16', '32']

permissions:
  contents: read

jobs:
  baseline:
    uses: ./.github/workflows/interop-matrix.yml
    # The reusable workflow declares an optional evidence publisher.
    permissions:
      contents: write
    with:
      shards: ${{ inputs.baseline_shards }}
      commit_evidence: false
      include_rich: true
  nine-hop:
    uses: ./.github/workflows/nine-hop.yml
    with:
      shards: ${{ inputs.nine_hop_shards }}
  report:
    needs: [baseline, nine-hop]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE: pkgs/tba-tests-interop-wimse
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interop-report
          path: reports/baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nine-hop-results
          path: reports/nine-hop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rich-generic-report
          path: reports/rich
      - name: Reconcile all 161,370 published execution IDs
        run: |
          status=0
          python "$PACKAGE/tests/ci_full_matrix.py" \
            --baseline "$PACKAGE/matrix/wimse-interop-all-tba-executions.json.gz" \
            --expanded "$PACKAGE/matrix/wimse-interop-rich-nine-hop-executions.json.gz" \
            --baseline-report reports/baseline --nine-hop-report reports/nine-hop \
            --rich-report reports/rich \
            --output full-matrix-results || status=$?
          if [[ -f full-matrix-results/summary.md ]]; then
            cat full-matrix-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: full-wimse-matrix-results
          path: full-matrix-results/
          if-no-files-found: error
