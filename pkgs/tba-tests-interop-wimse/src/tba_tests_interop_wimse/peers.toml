qualification_gap = "Stale and unavailable status require their own evidence."
qualification_scope = "Hosted status verifier and before-effect controls for the configured MintID fixture."
qualification_evidence = "https://github.com/tigrbl/tba-tests-interop-wimse/actions/runs/44021013592/attempts/2"

[implementations.authgent]
name = "authgent"
