candidate_ref = "8341cf932c9816dc666f2a6577b6776bd6f3b978"
candidate_support_roles = ["transaction-token-issuer"]
scenario_families = ["07", "08"]
reference = "https://github.com/cred-ninja/sdk/blob/586e1a76f487c2376e0ba0a4687bb2de8d3eb588/conformance/interop/authgent-txn-tokens.md"
qualification_gap = "The named nine-hop issuer requires req_wl to match the WIT subject and accepts a prior transaction token for narrowing. The pinned Authgent revision emits a client identifier and refuses the replacement grant."
qualification_scope = "Pinned transaction-token cases run in the original hosted matrix."
qualification_evidence = "https://github.com/tigrbl/tba-tests-interop-wimse/actions/runs/44021013592/attempts/2"

[implementations.omniarx]
