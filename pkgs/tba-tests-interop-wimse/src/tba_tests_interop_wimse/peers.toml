caller_profiles = ["wit-http-signature"]
receiver_profiles = ["wit-http-signature"]
wit_issuers = ["baseline"]

[implementations.rich-hackathon.workload_roles.research]
identity = "wimse://rich.ietf127.example/agent/research"
caller_profiles = ["wit-wpt"]
receiver_profiles = ["wit-http-signature"]
wit_issuers = ["baseline"]

[implementations.teleport-tbot]
