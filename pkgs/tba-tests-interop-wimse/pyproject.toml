[project]
name = "tba-tests-interop-wimse"
version = "0.4.0.dev3"
description = "WIMSE interoperability test matrix, peer fixtures, and execution analysis for Tigrbl Auth"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "wimse",
    "workload-identity",
    "interoperability",
    "protocol-testing",
    "test-matrix",
    "mtls",
    "spiffe",
    "svid",
    "workload-identity-certificate",
    "workload-identity-token",
    "workload-proof-token",
    "http-message-signatures",
    "transaction-tokens",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/tigrbl/tba-tests-interop-wimse"
Documentation = "https://github.com/tigrbl/tba-tests-interop-wimse/blob/master/INTEROP.md"
Readme = "https://github.com/tigrbl/tba-tests-interop-wimse/blob/master/pkgs/tba-tests-interop-wimse/README.md"
"Execution Results" = "https://tigrbl.github.io/tba-tests-interop-wimse/"
Repository = "https://github.com/tigrbl/tba-tests-interop-wimse"
Issues = "https://github.com/tigrbl/tba-tests-interop-wimse/issues"
License = "https://github.com/tigrbl/tba-tests-interop-wimse/blob/master/LICENSE"

[project.optional-dependencies]
wic = [
    "cryptography>=45",
    "tba-concrete-certificate-x509==0.4.0.dev2",
    "tba-contracts-security-trust==0.1.0",
    "tba-profile-workload-authentication-wimse-mtls==0.4.0.dev2",
    "tba-provider-certificate-status==0.4.0.dev2",
]

wpt = [
    "cryptography>=45",
    "tba-profile-workload-proof-wimse-wpt==0.4.0.dev3",
    "tba-profile-workload-proof-wimse-http-signature==0.4.0.dev2",
    "tba-provider-jose-cryptography==0.4.0.dev3",
    "tba-provider-replay-memory==0.4.0.dev2",
]

spiffe-wic = ["tba-protocol-workload-spiffe-svid==0.4.0.dev2"]

[project.scripts]
tba-tests-interop-wimse = "tba_tests_interop_wimse.__main__:main"
tba-wimse-wic-fixture = "tba_tests_interop_wimse.wic_cli:main"
tba-wimse-wpt-fixture = "tba_tests_interop_wimse.wpt_cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tba_tests_interop_wimse = ["factors.toml", "exclusions.toml", "scenarios.toml", "peers.toml", "fixtures.toml", "hops.toml", "nine_hop.toml"]
